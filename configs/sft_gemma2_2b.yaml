run_name: sft_gemma2_2b_reasoning
model_name: google/gemma-2-2b-it
precision: bf16
seed: 42

train:
  epochs: 1
  total_steps: 2000
  batch_size_per_device: 2
  max_seq_len: 2048
  lr: 1.0e-5
  warmup_steps: 100
  weight_decay: 0.01
  grad_clip: 1.0
  save_interval_steps: 200
  log_interval_steps: 20

data:
  train_path: data/processed/gsm8k_train.jsonl
  input_key: prompt
  target_key: target
  tokenizer_name: google/gemma-2-2b-it
  packing: false

output:
  out_dir: checkpoints/sft
  keep_last_n: 3